[package]
name = "lumiere-live"
version = "0.1.0"
edition = "2021"
description = "visualizador de sinal ao vivo estilo lumiere"

# crate isolado do pacote lutier na raiz
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "8.0.1"
